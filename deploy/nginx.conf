# Replace lark.example.com, then run: certbot --nginx -d lark.example.com
server {
    listen 80;
    server_name lark.example.com;
    client_max_body_size 10m;

    # While Lark restarts (a deploy takes a few seconds) show a page that reloads itself, not a bare 502.
    # Copy restarting.html to /var/www/lark/.
    error_page 502 503 504 @restarting;
    location @restarting {
        root /var/www/lark;
        add_header Cache-Control "no-store" always;
        if ($request_uri ~ ^/api/) {
            add_header Content-Type application/json always;
            add_header Retry-After 3 always;
            return 503 '{"error":"Lark is restarting. It will be back in a few seconds."}';
        }
        rewrite ^ /restarting.html break;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # stream chat replies as they arrive
        proxy_read_timeout 300s;
    }
}
